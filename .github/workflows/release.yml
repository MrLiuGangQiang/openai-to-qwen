name: release

# Build and push the image to Aliyun ACR.
# Repository secrets required:
#   ACR_USERNAME
#   ACR_PASSWORD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to push (default v1.0.0)"
        required: false
        default: "v1.0.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ACR personal edition rejects BuildKit attestation manifests
          # (config media type application/vnd.oci.empty.v1+json).
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/liugangqiang/openai-to-qwen:${{ github.event_name == 'push' && github.ref_name || inputs.version }}
            registry.cn-hangzhou.aliyuncs.com/liugangqiang/openai-to-qwen:latest