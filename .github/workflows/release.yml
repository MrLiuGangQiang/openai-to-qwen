name: release

# Build and push the image to Aliyun ACR when a v* tag is pushed.
# Repository secrets required:
#   ALIYUN_REGISTRY_USERNAME
#   ALIYUN_REGISTRY_PASSWORD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/liugangqiang/openai-to-qwen:${{ github.ref_name }}
            registry.cn-hangzhou.aliyuncs.com/liugangqiang/openai-to-qwen:latest