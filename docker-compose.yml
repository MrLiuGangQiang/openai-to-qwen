services:
  openai-to-qwen:
    build: .
    image: openai-to-qwen:latest
    container_name: openai-to-qwen
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LISTEN_ADDR=:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s